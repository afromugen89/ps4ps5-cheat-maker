name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      # Real-assembler tests (marker needs_nasm) skip when NASM is missing.
      - name: Fetch NASM (pinned, SHA-256 checked)
        run: python tools/fetch_nasm.py
      - run: pytest -q
  build:
    # The Windows build with NASM and the notices (cheatmaker.spec), smoke-tested with
    # --self-check (every module loads, the bundled assembler is found).
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Fetch NASM (pinned, SHA-256 checked)
        run: python tools/fetch_nasm.py
      - name: Build
        run: pyinstaller --noconfirm cheatmaker.spec
      - name: Smoke test the build
        shell: pwsh
        run: |
          $p = Start-Process dist\CheatMaker\CheatMaker.exe -ArgumentList '--self-check' -Wait -PassThru
          Get-Content dist\CheatMaker\self-check.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (-not (Test-Path dist\CheatMaker\_internal\nasm\nasm.exe)) { exit 1 }
          if (-not (Test-Path dist\CheatMaker\_internal\NOTICE)) { exit 1 }
