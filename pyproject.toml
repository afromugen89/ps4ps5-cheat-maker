[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cheatmaker"
version = "0.1.0"
description = "Guided cheat maker for jailbroken PS5 (PS5 and PS4 games), output for CheatRunner"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "iced-x86>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5", "pyinstaller>=6"]

[project.gui-scripts]
cheatmaker = "cheatmaker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = ["real_console: needs a real PS5 (skipped unless CHEATMAKER_PS5_IP is set)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["cheatmaker", "tests"]
